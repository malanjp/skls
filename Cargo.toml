[package]
name = "skls"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "TUI for listing and managing agent skills across Cursor, Claude Code, and Codex"
repository = "https://github.com/malanjp/skls"
homepage = "https://github.com/malanjp/skls"
documentation = "https://docs.rs/skls"
readme = "README.md"
keywords = ["tui", "skills", "agents", "cli", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
authors = ["malan"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.19"
toml = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
